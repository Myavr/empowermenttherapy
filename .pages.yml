# Pages CMS content configuration  —  https://pagescms.org
#
# Each entry below becomes a friendly form in the CMS editor. Editing content
# here only changes the JSON data files — never the HTML or CSS — so the site's
# styling can't be broken by content edits.

# Where uploaded images are stored / referenced (enables the upload button on image fields).
media:
  input: images
  output: /images

content:
  - name: countries
    label: Practitioners worldwide
    description: The countries shown in the "Practitioners Worldwide" bar on the home page.
    type: file
    path: data/countries.json
    fields:
      - name: items
        label: Countries
        description: One country per line. Use + to add, the trash icon to remove, drag to reorder.
        type: string
        list: true

  - name: news
    label: News
    description: Announcements in the "News & Events" section. Leave the list empty to hide the News column (and, if Events is also empty, the whole section).
    type: file
    path: data/news.json
    fields:
      - name: items
        label: News items
        type: object
        list: true
        fields:
          - name: date
            label: Date
            type: date
          - name: title
            label: Headline
            type: string
          - name: body
            label: Text
            type: text
          - name: link
            label: Link URL (optional)
            type: string
            required: false
          - name: link_label
            label: Link text (optional)
            type: string
            required: false

  - name: events
    label: Events
    description: One-time or recurring events. Leave the list empty to hide the Events column. Past one-time events disappear automatically; recurring events always show.
    type: file
    path: data/events.json
    fields:
      - name: items
        label: Events
        type: object
        list: true
        fields:
          - name: title
            label: Event name
            type: string
          - name: schedule_type
            label: Schedule
            description: Choose "Recurring" for something that repeats (e.g. a weekly group).
            type: select
            options:
              values:
                - One-time
                - Recurring
            default: One-time
          - name: date
            label: Date (one-time events only)
            type: date
            required: false
          - name: recurrence
            label: Repeats (recurring events, e.g. "Every Tuesday" or "First Monday of the month")
            type: string
            required: false
          - name: time
            label: Time (e.g. "5:00 PM UTC")
            type: string
            required: false
          - name: location
            label: Location (e.g. Online, Mexico City)
            type: string
            required: false
          - name: description
            label: Description (optional)
            type: text
            required: false
          - name: link
            label: Register / info link (optional)
            type: string
            required: false
          - name: link_label
            label: Link text (optional)
            type: string
            required: false

  - name: testimonials
    label: Testimonials
    description: Quotes shown in the "What Our Students Say" section on the home page.
    type: file
    path: data/testimonials.json
    fields:
      - name: items
        label: Testimonials
        type: object
        list: true
        fields:
          - name: photo
            label: Photo
            type: image
            required: false
          - name: quote
            label: Quote
            type: text
          - name: name
            label: Name and place (e.g. "Rev. Lindsey Turner, United States")
            type: string

  - name: hero
    label: Home hero
    description: The large headline at the top of the home page.
    type: file
    path: data/hero.json
    fields:
      - name: headline
        label: Headline
        type: text

  - name: team
    label: Team
    description: The people shown on the Team page.
    type: file
    path: data/team.json
    fields:
      - name: items
        label: Team members
        type: object
        list: true
        fields:
          - name: photo
            label: Photo
            type: image
            required: false
          - name: name
            label: Name
            type: string
          - name: role
            label: Role
            type: string
            required: false
          - name: bio
            label: Bio
            description: Separate paragraphs with a blank line.
            type: text
            required: false

  - name: values
    label: Values (timeline)
    description: The entries on the Values page timeline.
    type: file
    path: data/values.json
    fields:
      - name: items
        label: Timeline entries
        type: object
        list: true
        fields:
          - name: label
            label: Label (e.g. Vision, Mission)
            type: string
            required: false
          - name: title
            label: Title
            type: string
          - name: summary
            label: Summary
            type: text
            required: false
          - name: detail
            label: Detail
            description: Separate paragraphs with a blank line.
            type: text
            required: false

  - name: resources
    label: Resources
    description: The resource categories on the Resources page. Each has a colour, an icon, a title, a count, and a list of links.
    type: file
    path: data/resources.json
    fields:
      - name: categories
        label: Categories
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
          - name: count
            label: Count label (e.g. "5 readings")
            type: string
            required: false
          - name: color
            label: Colour
            type: select
            options:
              values:
                - blue
                - green
                - gold
                - seafoam
            default: blue
          - name: icon
            label: Icon (a single emoji or symbol)
            type: string
            required: false
          - name: open
            label: Expanded by default?
            type: boolean
            default: false
          - name: links
            label: Links
            type: object
            list: true
            fields:
              - name: title
                label: Title
                type: string
              - name: url
                label: Link URL
                type: string
              - name: author
                label: Author (optional)
                type: string
                required: false
              - name: description
                label: Description (optional)
                type: text
                required: false

  - name: faq
    label: FAQ
    description: The questions and answers in the "Frequently Asked Questions" section on the home page.
    type: file
    path: data/faq.json
    fields:
      - name: items
        label: Questions
        type: object
        list: true
        fields:
          - name: question
            label: Question
            type: string
          - name: answer
            label: Answer
            description: The answer is built from blocks. Add a block for each paragraph. Use **double asterisks** for bold and *single asterisks* for italic.
            type: object
            list: true
            fields:
              - name: style
                label: Block type
                description: Paragraph is normal text. Scene is an italic intro line. Dialogue shows a back-and-forth (one line per exchange, written as "Name: what they said"). Closing is the final emphasized line. Divider is a small horizontal rule (no text needed).
                type: select
                options:
                  values:
                    - paragraph
                    - scene
                    - dialogue
                    - closing
                    - divider
                default: paragraph
              - name: text
                label: Text
                type: text
                required: false
