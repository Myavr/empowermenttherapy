# Pages CMS content configuration  —  https://pagescms.org
#
# Each entry below becomes a friendly form in the CMS editor. Editing content
# here only changes the JSON data files — never the HTML or CSS — so the site's
# styling can't be broken by content edits.

# Where uploaded images are stored / referenced (enables the upload button on image fields).
# output has no leading slash so new uploads are saved as "images/file.jpg" —
# matching the relative paths the rest of the site already uses (works whether the
# site is served from the domain root or a project subpath).
media:
  - name: images
    label: Images
    input: images
    output: images
  - name: pdfs
    label: PDFs
    input: pdfs
    output: pdfs
    extensions: [pdf]

content:
  - name: book_samples
    label: Book chapter samples
    description: The Chapter samples dropdown beside the book on the Resources page. Add, remove, and reorder chapters here. Each PDF opens in a new tab.
    type: file
    path: data/book-samples.json
    fields:
      - name: label
        label: Dropdown button text
        type: string
        required: true
      - name: chapters
        label: Chapter samples
        type: object
        list: true
        required: false
        fields:
          - name: title
            label: Chapter title
            type: string
            required: true
          - name: pdf
            label: Sample PDF
            description: Select an existing PDF or upload a new one to the PDFs library.
            type: file
            required: true
            options:
              media: pdfs
              extensions: [pdf]


  - name: contributions
    label: Contributions
    description: The monthly contribution page. Edit the text and the three options here. PayPal controls the actual charge; confirm that every displayed amount and currency matches its PayPal plan. Paste only the plan ID, not the entire button code.
    type: file
    path: data/contributions.json
    fields:
      - name: page_title
        label: Browser page title
        type: string
        required: true
      - name: eyebrow
        label: Small heading above the title
        type: string
      - name: title
        label: Main heading
        type: text
        required: true
      - name: intro
        label: Introduction
        type: text
      - name: tiers_heading
        label: Contribution options heading
        type: string
      - name: tiers_intro
        label: Contribution options introduction
        type: text
      - name: currency
        label: Currency
        description: Three-letter currency code, such as USD. Must match the PayPal plans.
        type: string
        required: true
      - name: checkout_label
        label: Subscription button text
        type: string
        required: true
      - name: unavailable_label
        label: Contact button text for an option without a PayPal plan
        description: An option without a plan links to Contact instead of starting a subscription.
        type: string
        required: true
      - name: billing_note
        label: Monthly billing explanation
        description: Clearly explain that these payments recur monthly until cancelled.
        type: text
        required: true
      - name: tiers
        label: Monthly contribution options
        type: object
        list: true
        required: true
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: amount
            label: Monthly amount
            description: Displayed on the website only. Changing this does not change the PayPal plan's charge.
            type: number
            required: true
          - name: description
            label: What this contribution supports
            type: text
          - name: color
            label: Card colour
            type: select
            options:
              values:
                - green
                - gold
                - blue
            default: green
          - name: paypal_plan_id
            label: PayPal monthly subscription plan ID
            description: Copy the P-... value from plan_id in the PayPal button code. Leave blank to show a contact link. Check the plan amount and currency in PayPal before saving.
            type: string
            required: false
      - name: help
        label: Other arrangements and financial support
        type: object
        fields:
          - name: eyebrow
            label: Small heading
            type: string
          - name: title
            label: Heading
            type: string
          - name: text
            label: Message
            type: text
          - name: link_label
            label: Contact button text
            type: string
      - name: enrollment_note
        label: Note for new participants
        type: text
      - name: enrollment_link_label
        label: Programs link text
        type: string

  - name: footer
    label: Site footer
    description: Edit the footer once for every page. Changes appear across the website after publishing finishes. You can add, remove, and reorder navigation links and people.
    type: file
    path: data/footer.json
    fields:
      - name: social
        label: Social media
        type: object
        fields:
          - name: instagram_url
            label: Instagram URL
            description: Leave blank to hide this icon.
            type: string
            required: false
          - name: facebook_url
            label: Facebook URL
            description: Leave blank to hide this icon.
            type: string
            required: false
      - name: book
        label: Book
        type: object
        fields:
          - name: image
            label: Book cover
            type: image
            required: false
          - name: image_alt
            label: Cover description (for accessibility)
            type: string
            required: false
          - name: url
            label: Book purchase URL
            description: Leave blank to hide the cover and purchase link.
            type: string
            required: false
          - name: label
            label: Purchase link text
            type: string
          - name: endorsements_url
            label: Endorsements URL
            description: Use endorsements.html for this website's endorsements page. Leave blank to hide the link.
            type: string
            required: false
          - name: endorsements_label
            label: Endorsements link text
            type: string
      - name: navigation
        label: Navigation
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
          - name: links
            label: Links
            type: object
            list: true
            required: false
            fields:
              - name: label
                label: Link text
                type: string
              - name: url
                label: Link URL
                description: Use a page name such as contact.html or a full https URL.
                type: string
      - name: contact
        label: Contact and people
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
          - name: email
            label: Email address
            description: Updates the email link in every footer and on the Contact page. Contact form delivery is managed separately.
            type: string
            required: true
          - name: people
            label: People
            type: object
            list: true
            required: false
            fields:
              - name: name
                label: Name
                type: string
              - name: image
                label: Photo
                type: image
              - name: image_alt
                label: Photo description (for accessibility)
                description: Uses the person's name if left blank.
                type: string
                required: false
      - name: support
        label: Support
        type: object
        fields:
          - name: heading
            label: Heading
            type: string
          - name: subscribe_link_label
            label: Payment plans button text
            description: Links to the Contributions page. Edit its payment options in the Contributions CMS entry.
            type: string
      - name: copyright
        label: Copyright line
        type: string

  - name: endorsements
    label: Book endorsements
    description: Edit the endorsements page heading, introduction, and quotes. Leave the list empty until endorsements are ready.
    type: file
    path: data/endorsements.json
    fields:
      - name: title
        label: Page title
        type: string
      - name: intro
        label: Introduction
        type: text
        required: false
      - name: empty_message
        label: Message when no endorsements are listed
        type: text
      - name: items
        label: Endorsements
        type: object
        list: true
        required: false
        fields:
          - name: image
            label: Picture (optional)
            description: Displayed above the endorsement.
            type: image
            required: false
          - name: image_alt
            label: Picture description (for accessibility)
            type: string
            required: false
          - name: quote
            label: Endorsement
            type: text
          - name: author
            label: Name and credentials
            type: string
            required: false

  - name: countries
    label: Practitioners worldwide
    description: The countries shown in the "Practitioners Worldwide" bar on the home page.
    type: file
    path: data/countries.json
    fields:
      - name: items
        label: Countries
        description: One country per line. Use + to add, the trash icon to remove, drag to reorder.
        type: string
        list: true

  - name: news
    label: News
    description: Announcements in the "News & Events" section. Leave the list empty to hide the News column (and, if Events is also empty, the whole section).
    type: file
    path: data/news.json
    fields:
      - name: items
        label: News items
        type: object
        list: true
        fields:
          - name: date
            label: Date
            type: date
          - name: title
            label: Headline
            type: string
          - name: body
            label: Text
            type: text
          - name: link
            label: Link URL (optional)
            type: string
            required: false
          - name: link_label
            label: Link text (optional)
            type: string
            required: false

  - name: events
    label: Events
    description: Events shown on both the Events page and the home-page "News & Events" section. Use + to add and the trash icon to remove. After their final date, one-time events automatically move to Past Events on the Events page and leave the home page. Past events appear most recently finished first; recurring events stay upcoming.
    type: file
    path: data/events.json
    fields:
      - name: items
        label: Events
        type: object
        list: true
        fields:
          - name: title
            label: Event name
            type: string
          - name: schedule_type
            label: Schedule
            description: Choose "Recurring" for something that repeats (e.g. a weekly group).
            type: select
            options:
              values:
                - One-time
                - Recurring
            default: One-time
          - name: date
            label: Start date (one-time events only)
            description: For a single-day event, set this date and leave the end date blank. Leave blank if the date is not yet known.
            type: date
            required: false
          - name: end_date
            label: End date (optional)
            description: For a multi-day event, choose its final day, on or after the start date. The event moves to Past Events the following day, using the visitor's local date. Without an end date, the start date is used.
            type: date
            required: false
          - name: recurrence
            label: Repeats (recurring events, e.g. "Every Tuesday" or "First Monday of the month")
            type: string
            required: false
          - name: times
            label: Event times
            description: Add one display-ready time per line (e.g. "9:00–11:00 AM Chicago"). These appear in the order entered.
            type: string
            list: true
            required: false
          - name: location
            label: Location (e.g. Online, Mexico City)
            type: string
            required: false
          - name: description
            label: Description (optional)
            type: text
            required: false
          - name: image
            label: Event image (optional)
            type: image
            required: false
          - name: image_alt
            label: Image description (for accessibility)
            description: Briefly describe the image for visitors who cannot see it.
            type: string
            required: false
          - name: prices
            label: Prices
            description: Add one display-ready price per line (e.g. "300 Indian Rupees" or "$10.00 US dollars").
            type: string
            list: true
            required: false
          - name: presenter
            label: Presenter
            type: string
            required: false
          - name: link
            label: Registration / information link (optional)
            description: Use a full URL, or "contact.html" to link to this website's Contact page.
            type: string
            required: false
          - name: link_label
            label: Registration link text (optional)
            type: string
            required: false

  - name: testimonials
    label: Testimonials
    description: Quotes shown in the "What Our Students Say" section on the home page.
    type: file
    path: data/testimonials.json
    fields:
      - name: items
        label: Testimonials
        type: object
        list: true
        fields:
          - name: photo
            label: Photo
            type: image
            required: false
          - name: quote
            label: Quote
            type: text
          - name: name
            label: Name and place (e.g. "Rev. Lindsey Turner, United States")
            type: string

  - name: hero
    label: Home hero
    description: The large headline at the top of the home page.
    type: file
    path: data/hero.json
    fields:
      - name: headline
        label: Headline
        type: text

  - name: team
    label: Team
    description: The people shown on the Team page.
    type: file
    path: data/team.json
    fields:
      - name: items
        label: Team members
        type: object
        list: true
        fields:
          - name: photo
            label: Photo
            type: image
            required: false
          - name: name
            label: Name
            type: string
          - name: role
            label: Role
            type: string
            required: false
          - name: bio
            label: Bio
            description: Separate paragraphs with a blank line.
            type: text
            required: false

  - name: values
    label: Values
    description: The image and text sections on the Values page.
    type: file
    path: data/values.json
    fields:
      - name: items
        label: Values sections
        type: object
        list: true
        fields:
          - name: label
            label: Label (e.g. Vision, Mission)
            type: string
            required: false
          - name: title
            label: Title
            type: string
          - name: image
            label: Paired image (optional)
            description: Displays beside this value's text, or above it on mobile. Sections without images use the available width.
            type: image
            required: false
          - name: image_alt
            label: Image description (for accessibility)
            type: string
            required: false
          - name: summary
            label: Summary
            type: text
            required: false
          - name: detail
            label: Detail
            description: Separate paragraphs with a blank line.
            type: text
            required: false

  - name: resources
    label: Resources
    description: The resource categories on the Resources page. Each has a colour, an icon, a title, a count, and a list of links.
    type: file
    path: data/resources.json
    fields:
      - name: categories
        label: Categories
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
          - name: color
            label: Colour
            type: select
            options:
              values:
                - blue
                - green
                - gold
                - seafoam
            default: blue
          - name: icon
            label: Icon (a single emoji or symbol)
            type: string
            required: false
          - name: links
            label: Links
            type: object
            list: true
            fields:
              - name: title
                label: Title
                type: string
              - name: url
                label: Link URL
                type: string
              - name: author
                label: Author (optional)
                type: string
                required: false
              - name: description
                label: Description (optional)
                type: text
                required: false

  - name: faq
    label: FAQ
    description: The questions and answers in the "Frequently Asked Questions" section on the home page.
    type: file
    path: data/faq.json
    fields:
      - name: items
        label: Questions
        type: object
        list: true
        fields:
          - name: question
            label: Question
            type: string
          - name: answer
            label: Answer
            description: The answer is built from blocks. Add a block for each paragraph. Use **double asterisks** for bold and *single asterisks* for italic.
            type: object
            list: true
            fields:
              - name: style
                label: Block type
                description: 'Paragraph is normal text. Scene is an italic intro line. Dialogue shows a back-and-forth (one line per exchange, written as "Name: what they said"). Closing is the final emphasized line. Divider is a small horizontal rule (no text needed).'
                type: select
                options:
                  values:
                    - paragraph
                    - scene
                    - dialogue
                    - closing
                    - divider
                default: paragraph
              - name: text
                label: Text
                type: text
                required: false

  - name: home
    label: Home page text
    description: One-off text on the home page — the Problem section, the "What We Are Doing" strips, and the "Who Is This For?" blocks. Use **double asterisks** for bold and *single asterisks* for italic.
    type: file
    path: data/home.json
    fields:
      - name: problem
        label: The Problem section
        type: object
        fields:
          - name: title
            label: Section title
            type: string
          - name: paragraphs
            label: Opening paragraphs
            type: text
            list: true
          - name: thesis
            label: Emphasized statements
            description: The two highlighted statements below the opening paragraphs.
            type: text
            list: true
          - name: disclaimer
            label: Disclaimer (italic footnote)
            type: text
            required: false
      - name: doing
        label: What We Are Doing
        type: object
        fields:
          - name: title
            label: Section title
            type: string
          - name: strips
            label: Expandable strips
            type: object
            list: true
            fields:
              - name: title
                label: Strip title
                type: string
              - name: image
                label: Background image
                type: image
                required: false
              - name: body
                label: Body
                type: object
                list: true
                fields:
                  - name: type
                    label: Block type
                    description: Choose "paragraph" for a line of text, or "list" for a bulleted list.
                    type: select
                    options:
                      values:
                        - paragraph
                        - list
                    default: paragraph
                  - name: text
                    label: Paragraph text (for paragraph blocks)
                    description: "Tip: {{countryCount}} is replaced automatically with the current number of countries from the Practitioners-Worldwide list, so you never have to update it by hand."
                    type: text
                    required: false
                  - name: items
                    label: Bullet points (for list blocks)
                    type: text
                    list: true
                    required: false
      - name: who
        label: Who Is This For?
        type: object
        fields:
          - name: eyebrow
            label: Header label
            type: string
          - name: blocks
            label: Audience blocks
            description: The three fixed audience blocks. You can edit the words here; the images and layout are managed in the page design.
            type: object
            list: true
            fields:
              - name: eyebrow
                label: Label (e.g. For Therapists)
                type: string
              - name: heading
                label: Heading
                type: string
              - name: text
                label: Text
                type: text
          - name: quote
            label: Pull quote
            description: The highlighted quote below the audience blocks (one paragraph per line).
            type: text
            list: true

  - name: pages
    label: Page intros & contact
    description: The title and subtitle at the top of each inner page, plus the Contact page phone number. Edit the shared email address under Site footer.
    type: file
    path: data/pages.json
    fields:
      - name: programs
        label: Programs page
        type: object
        fields:
          - name: hero_title
            label: Title
            type: string
          - name: hero_subtitle
            label: Subtitle
            type: text
      - name: resources
        label: Resources page
        type: object
        fields:
          - name: hero_title
            label: Title
            type: string
          - name: hero_subtitle
            label: Subtitle
            type: text
      - name: team
        label: Team page
        type: object
        fields:
          - name: hero_title
            label: Title
            type: string
          - name: hero_subtitle
            label: Subtitle
            type: text
      - name: values
        label: Values page
        type: object
        fields:
          - name: hero_title
            label: Title
            type: string
          - name: hero_subtitle
            label: Subtitle
            type: text
      - name: contact
        label: Contact page
        type: object
        fields:
          - name: hero_title
            label: Title
            type: string
          - name: hero_subtitle
            label: Subtitle
            type: text
          - name: phone
            label: Phone number
            type: string

  - name: programs
    label: Program levels
    description: The three level cards on the Programs page. You can edit all the wording; the meeting times, expand behavior, and payment button are managed in the page design. Use **double asterisks** for bold, *single asterisks* for italic, and [text](https://link) for links.
    type: file
    path: data/programs.json
    fields:
      - name: levels
        label: Levels
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
          - name: intro
            label: Intro line(s)
            type: text
            list: true
          - name: note
            label: Note under the intro (optional)
            type: string
            required: false
          - name: blocks
            label: Detail sections
            type: object
            list: true
            fields:
              - name: heading
                label: Section heading
                type: string
              - name: body
                label: Content
                type: object
                list: true
                fields:
                  - name: type
                    label: Block type
                    description: "paragraph = a line of text; bullets = a bulleted list; numbered = a numbered list; note = a small footnote line. (Internally: p / ul / ol / note.)"
                    type: select
                    options:
                      values:
                        - p
                        - ul
                        - ol
                        - note
                    default: p
                  - name: text
                    label: Text (for paragraph / note)
                    type: text
                    required: false
                  - name: columns
                    label: Show list in two columns (bulleted lists only)
                    type: boolean
                    default: false
                  - name: items
                    label: List items (for bullets / numbered)
                    type: text
                    list: true
                    required: false
                  - name: role
                    label: Special role
                    description: Leave blank. "meetingTime" marks the auto-localized class time line and should not be changed.
                    type: string
                    required: false
          - name: register
            label: How-to-enroll line (optional)
            type: text
            required: false
